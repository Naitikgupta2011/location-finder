
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080f20">
  <title>Location Finder</title>

  <link rel="stylesheet" href="style.css">

  <!-- Leaflet Map -->
  <link rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>
  <header class="header">
    <div class="logo">📍</div>
    <div>
      <h2>Location Finder</h2>
      <p>Stay connected, share safely.</p>
    </div>
  </header>

  <main class="container">
    <section class="welcome">
      <p class="eyebrow">YOUR LOCATION</p>
      <h1>Live Location Map</h1>
      <p>See your current location in real time.</p>
    </section>

    <section class="map-card">
      <div class="map-heading">
        <h3>My Live Map</h3>
        <span id="status">Not started</span>
      </div>

      <div id="map"></div>

      <div class="coordinates">
        <p id="latitude">Latitude: --</p>
        <p id="longitude">Longitude: --</p>
        <p id="accuracy">Accuracy: --</p>
      </div>
    </section>

    <section class="controls">
      <button class="primary" onclick="requestLocation()">
        📍 Start Live Location
      </button>
      
      <button class="follow" onclick="toggleFollow()">
  🧭 Follow Me: ON
</button>
        

      <button class="stop" onclick="stopLocation()">
        ■ Stop Location
      </button>
    </section>

    <p class="privacy">
      Your location. Your permission. Your control.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
